name: Android CI

on:
  push:
    branches-ignore: [ "stable" ]
    paths-ignore:
      - ".github/**"
      - "!.github/workflows/**"
      - ".idea/"
      - "assets/"
      - "metadata/"
      - '.gitignore'
      - "*.md"
      - "LICENSE.txt"
  pull_request:
    branches-ignore: [ "stable" ]
    paths-ignore:
      - ".github/**"
      - "!.github/workflows/**"
      - ".idea/"
      - "assets/"
      - "metadata/"
      - '.gitignore'
      - "*.md"
      - "LICENSE.txt"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'zulu'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Lint
        run: ./gradlew lint

  build:
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.changelog.outputs.result }}
      apk_file_name: ${{ steps.set_apk_output.outputs.apk_name }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-java@v5
      with:
        java-version: 21
        distribution: 'zulu'
        cache: gradle

    - name: Create signing key
      if: github.event_name != 'pull_request'
      env:
        SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      run: |
        echo $SIGNING_KEY | base64 -di > ${{ runner.temp }}/booming_keystore.jks

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create Last.fm config
      if: github.event_name != 'pull_request'
      env:
        LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
      run: |
        PROPERTIES_FILE="local.properties"
        echo "LASTFM_API_KEY=${LASTFM_API_KEY}" >> $PROPERTIES_FILE
        echo "LASTFM_SECRET=${LASTFM_SECRET}" >> $PROPERTIES_FILE

    - name: Build with Gradle
      run: |
        if [ "$EVENT_NAME" = "pull_request" ]; then
          ./gradlew assembleDebug
        else
          # Extract signing properties and pass to Gradle as env vars
          echo "$SIGNING_PROPERTIES" | base64 -di > temp.properties
          export KEY_ALIAS=$(grep keyAlias temp.properties | cut -d'=' -f2 | tr -d '\r' | xargs)
          export KEY_PASSWORD=$(grep keyPassword temp.properties | cut -d'=' -f2 | tr -d '\r' | xargs)
          export STORE_PASSWORD=$(grep storePassword temp.properties | cut -d'=' -f2 | tr -d '\r' | xargs)
          export KEYSTORE_FILE="${{ runner.temp }}/booming_keystore.jks"
          rm temp.properties

          ./gradlew assembleRelease
        fi
      env:
        RELEASE_TYPE: "CI"
        EVENT_NAME: ${{ github.event_name }}
        SIGNING_PROPERTIES: ${{ secrets.SIGNING_PROPERTIES }}

    - name: Create Changelog
      id: changelog
      if: github.event_name != 'pull_request'
      uses: actions/github-script@v9
      env:
        COMMITS: ${{ toJSON(github.event.commits) }}
      with:
        result-encoding: string
        script: |
          const commits = JSON.parse(process.env.COMMITS);
          return commits
            .map(commit => `- ${commit.message.split("\n")[0]}`)
            .join("\n");

    - name: Find APK (CI build)
      id: set_apk_output
      if: github.event_name != 'pull_request'
      run: |
        APK_PATH=$(find app/build/outputs/apk/github/release -name '*.apk')
        APK_NAME=$(basename "$APK_PATH")
        echo "APK_FILE=$APK_PATH" >> $GITHUB_ENV
        echo "APK_FILE_NAME=$APK_NAME" >> $GITHUB_ENV
        echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT

    - name: Find APK (PR)
      if: github.event_name == 'pull_request'
      run: |
        APK_PATH=$(find app/build/outputs/apk/github/debug -name '*.apk')
        echo "APK_FILE=$APK_PATH" >> $GITHUB_ENV
        echo "APK_FILE_NAME=$(basename "$APK_PATH")" >> $GITHUB_ENV

    - name: Upload apk (CI build)
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.APK_FILE_NAME }}
        path: ${{ env.APK_FILE }}
        archive: false

    - name: Upload apk (PR)
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.APK_FILE_NAME }}
        path: ${{ env.APK_FILE }}

  notify:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
    - name: Set Short SHA
      id: vars
      run: echo "short_sha=$(echo $LONG_SHA | cut -c 1-7)" >> $GITHUB_OUTPUT
      env:
        LONG_SHA: ${{ github.sha }}

    - name: Download apk
      uses: actions/download-artifact@v8
      with:
        name: ${{ needs.build.outputs.apk_file_name }}
        path: .

    - name: Send files to Telegram
      uses: xz-dev/TelegramFileUploader@f597b98950e55d2b15f2fc94d1410cb557d829e0 # v1.2.3
      with:
        to-who: ${{ secrets.TG_CHAT_ID }}
        message: |
          🌿 **Branch:** `${{ github.ref_name }}`
          📌 **Commit:** `${{ steps.vars.outputs.short_sha }}`
          🚀 **Run:** [Link](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          📋 **Changelog:**
          ${{ needs.build.outputs.changelog }}
        files: |
          ./${{ needs.build.outputs.apk_file_name }}
      env:
        API_ID: ${{ secrets.TG_API_ID }}
        API_HASH: ${{ secrets.TG_API_HASH }}
        BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
